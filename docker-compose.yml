version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: quote_nemo_db
    environment:
      POSTGRES_DB: quote_nemo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quote_nemo_backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/quote_nemo
      - DATABASE_URL_SYNC=postgresql://postgres:postgres@db:5432/quote_nemo
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - ./backend:/app
      - /app/__pycache__
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quote_nemo_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data: