[project]
name = "yulsoft-quote-backend"
version = "0.1.0"
description = "율소프트 견적서 MVP 백엔드"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.110.1",
    "uvicorn[standard]==0.29.0",
    "sqlalchemy==2.0.30",
    "alembic==1.13.1",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "pydantic==2.7.1",
    "pydantic-settings==2.3.2",
    "pydantic-extra-types==2.7.0",
    "python-multipart==0.0.9",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-jose==3.3.0",
    "email-validator==2.1.0.post1",
    "weasyprint==62.0",
    "jinja2==3.1.4",
    "python-multipart==0.0.9",
    "httpx==0.27.0",
    "tenacity==8.2.3",
    "structlog==24.1.0",
    "python-json-logger==2.0.7",
    "prometheus-client==0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.3",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "pre-commit==3.7.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "C4", "ANN", "ARG", "PTH", "T20", "TCH", "SIM", "PIE", "PL", "TRY", "NPY", "RUF", "PD", "PGH", "RET", "ERA", "ICN", "QF", "TID", "FA", "FLY", "EXE", "ISC", "PERF", "C90", "LOG"]
ignore = ["E501", "B008", "C901", "ARG001", "ARG002"]
fixable = ["F", "I", "UP", "B", "C4", "T20", "TCH", "SIM", "PIE", "PL", "TRY", "NPY", "RUF", "PD", "PGH", "RET", "ERA", "ICN", "QF", "TID", "FA", "FLY", "EXE", "ISC", "PERF", "C90", "LOG"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.alembic]
script_location = "alembic"
version_locations = "alembic/versions"